server {
    listen 8080;
    client_max_body_size 12m;
    root /usr/share/nginx/html;

    # 컨테이너 재배포 시 IP 가 바뀌어도 다시 찾도록 Docker DNS 를 주기적으로 조회
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $auth http://auth:8081;
    set $core http://core:8082;
    set $stl  http://settlement:8083;

    # 소형 구성: nginx 가 게이트웨이 역할 (K8s 에서는 Ingress + gateway)
    location /api/auth/          { proxy_pass $auth; }
    location /.well-known/       { proxy_pass $auth; }
    location /api/core/          { proxy_pass $core; }
    location /api/stl/           { proxy_pass $stl; }
    location /internal/          { return 404; }   # 내부 API 외부 차단

    location / { try_files $uri /index.html; }
}
