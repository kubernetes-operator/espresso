# 이미지: deploy/images.sh 로 빌드·push 한 태그
image:
  registry: registry.local.cloud:5000
  repository: cafedelyon
  tag: ""            # 필수: --set image.tag=<git 커밋 7자리>
  pullPolicy: IfNotPresent

host: lyon.studiobasa.com

# 기존 공용 Gateway (Gateway API, nginx) 에 HTTPRoute 로 연결
gateway:
  name: gateway
  namespace: default
  sectionNames: [http, https]

# 업로드(첨부·엑셀) 최대 크기 — NGINX Gateway 기본 1MB 보다 크게
clientMaxBodySize: 12m

# 데모 계정·데이터 (테스트 기간에만 true, 운영 전환 시 false)
demo:
  seed: true
  showAccounts: true

# DB 자격 증명: 차트가 만들지 않음. 설치 전에 운영자가 직접 생성
#   keys: postgres-password, replication-password
db:
  existingSecret: cafedelyon-db
  image: postgres:16
  storageClass: nfs-nas-sc-main
  size: 20Gi
  standby:
    enabled: true
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 2Gi }

uploads:
  storageClass: nfs-nas-sc-main
  size: 10Gi

# auth: 토큰 서명 키가 메모리에 있어 1개 유지 / core: Outbox 순서 전달 때문에 1개 유지
services:
  auth:       { port: 8081, resources: { requests: { cpu: 100m, memory: 384Mi }, limits: { memory: 768Mi } } }
  core:       { port: 8082, resources: { requests: { cpu: 200m, memory: 512Mi }, limits: { memory: 1Gi } } }
  settlement: { port: 8083, resources: { requests: { cpu: 100m, memory: 384Mi }, limits: { memory: 768Mi } } }
web:
  replicas: 2
  resources: { requests: { cpu: 20m, memory: 32Mi }, limits: { memory: 128Mi } }
