server:
  port: 8081
spring:
  application.name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
  flyway:
    locations: classpath:db/migration
app:
  token-ttl-hours: ${TOKEN_TTL_HOURS:12}
  demo:
    seed: ${DEMO_SEED:true}          # 데모 계정 생성 (운영에서는 false)
    show-accounts: ${DEMO_SHOW_ACCOUNTS:true}   # 로그인 화면 계정 바로가기
management.endpoints.web.exposure.include: health,info
