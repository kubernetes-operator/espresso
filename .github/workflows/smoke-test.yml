# 스모크 테스트: 새 DB로 전체 구성(docker-compose)을 띄워 계정별 권한·업무 흐름을 API로 점검
#  - 빌드: deploy/build.sh (Docker 안에서 Gradle·npm 빌드)
#  - 실행: PostgreSQL primary+standby, auth/core/settlement, nginx
#  - 점검: tests/smoke_test.py (61항목), tests/check_replication.sh (DB 2중화)
# 자격 증명 불필요: 데모 시드 계정(demo1234)과 로컬 trust DB 만 사용하며 Secret 을 쓰지 않음
name: smoke-test

on:
  pull_request:
  push:
    branches: [main, develop, "feature/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: espresso-ci
      WEB_PORT: "18080"
    steps:
      - uses: actions/checkout@v4

      - name: 빌드 캐시 (Gradle·npm)
        uses: actions/cache@v4
        with:
          path: |
            .cache/gradle
            .cache/npm
          key: build-${{ runner.os }}-${{ hashFiles('backend/**/*.gradle', 'web/package-lock.json') }}
          restore-keys: build-${{ runner.os }}-

      - name: 빌드 (백엔드 JAR + 웹)
        run: deploy/build.sh

      - name: 전체 구성 기동
        working-directory: deploy/compose
        run: docker compose up -d --build

      - name: 기동·데모 데이터 준비 대기
        run: python3 tests/wait_ready.py http://localhost:18080 300

      - name: 스모크 테스트
        run: python3 tests/smoke_test.py http://localhost:18080

      - name: DB 2중화 점검
        run: bash tests/check_replication.sh

      - name: 실패 시 서비스 로그
        if: failure()
        working-directory: deploy/compose
        run: docker compose logs --no-color --tail=300 auth core settlement web

      - name: 정리
        if: always()
        working-directory: deploy/compose
        run: docker compose down -v
